name: Pilot Build
# Stage 8 replacement audit-candidate trigger after child-facing wording refresh.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "content/**"
      - "pyproject.toml"
      - ".github/workflows/pilot-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: repetitor-windows
            sep: ";"
            executable: "dist/REPETITOR/REPETITOR.exe"
          - os: macos-latest
            artifact: repetitor-macos
            sep: ":"
            executable: "dist/REPETITOR/REPETITOR"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build pilot bundle
        shell: bash
        run: |
          printf '%s\\n' "${{ github.sha }}" > build-info.txt
          pyinstaller --noconfirm --clean --onedir --paths src --name REPETITOR --add-data "content${{ matrix.sep }}content" --add-data "build-info.txt${{ matrix.sep }}." src/repetitor/__main__.py

      - name: Verify bundled offline content
        shell: bash
        run: |
          test -d dist/REPETITOR
          test -f dist/REPETITOR/_internal/content/mathematics/fractions/add_unlike/module.yaml || test -f dist/REPETITOR/content/mathematics/fractions/add_unlike/module.yaml
          test -f dist/REPETITOR/_internal/content/mathematics/fractions/add_unlike/problems.yaml || test -f dist/REPETITOR/content/mathematics/fractions/add_unlike/problems.yaml

      - name: Smoke-test packaged executable
        shell: bash
        run: |
          "${{ matrix.executable }}" --smoke-test
          BUILD_INFO="$("${{ matrix.executable }}" --build-info)"
          echo "$BUILD_INFO"
          echo "$BUILD_INFO" | grep "${{ github.sha }}"

      - name: Upload unsigned pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/REPETITOR
          if-no-files-found: error
          retention-days: 14
