remediations:
  - skill_id: math.g6.fractions.equivalent
    title_ru: "Эквивалентные дроби"
    explanation_ru: >-
      Дробь не меняет значение, если числитель и знаменатель умножить
      на одно и то же ненулевое число. Например, 1/3 = 2/6:
      мы умножили и верхнюю, и нижнюю часть на 2.
    return_problem_id: frac.add.probe.lcm
    problem:
      id: frac.remediation.equivalent.001
      primary_skill: math.g6.fractions.equivalent
      purpose: remediation
      prompt_ru: "Заполни пропуск: 2/5 = ?/10"
      verifier:
        type: exact_integer
        expected: 4

  - skill_id: math.prereq.lcm
    title_ru: "Наименьшее общее кратное"
    explanation_ru: >-
      Общее кратное делится на оба числа. Для 4 и 6 кратные:
      4, 8, 12… и 6, 12… Первое общее — 12, значит НОК(4, 6) = 12.
    return_problem_id: frac.add.guided.001
    problem:
      id: frac.remediation.lcm.001
      primary_skill: math.prereq.lcm
      purpose: remediation
      prompt_ru: "Найди НОК(6, 8)."
      verifier:
        type: exact_integer
        expected: 24
