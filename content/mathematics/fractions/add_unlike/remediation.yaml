remediations:
  - skill_id: math.g6.fractions.equivalent
    title_ru: "Эквивалентные дроби"
    explanation_ru: >-
      Дробь не меняет значение, если числитель и знаменатель умножить
      на одно и то же ненулевое число. Например, 1/3 = 2/6:
      мы умножили и верхнюю, и нижнюю часть на 2.
    return_problem_id: frac.add.probe.lcm
    exit_mastery: 0.45
    problems:
      - id: frac.remediation.equivalent.guided
        primary_skill: math.g6.fractions.equivalent
        purpose: guided
        prompt_ru: "С поддержкой: 2/5 = ?/10. На что умножили 5, чтобы получить 10? Теперь умножь 2 на то же число."
        verifier: {type: exact_integer, expected: 4}
      - id: frac.remediation.equivalent.independent.1
        primary_skill: math.g6.fractions.equivalent
        purpose: independent
        prompt_ru: "Самостоятельно: 3/4 = ?/12"
        verifier: {type: exact_integer, expected: 9}
      - id: frac.remediation.equivalent.independent.2
        primary_skill: math.g6.fractions.equivalent
        purpose: independent
        prompt_ru: "Ещё одна проверка: 5/6 = ?/18"
        verifier: {type: exact_integer, expected: 15}

  - skill_id: math.prereq.lcm
    title_ru: "Наименьшее общее кратное"
    explanation_ru: >-
      Общее кратное делится на оба числа. Для 4 и 6 кратные:
      4, 8, 12… и 6, 12… Первое общее — 12, значит НОК(4, 6) = 12.
    return_problem_id: frac.add.guided.001
    exit_mastery: 0.45
    problems:
      - id: frac.remediation.lcm.guided
        primary_skill: math.prereq.lcm
        purpose: guided
        prompt_ru: "С поддержкой: выпиши кратные 6 и 8. Какое первое число встречается в обоих списках?"
        verifier: {type: exact_integer, expected: 24}
      - id: frac.remediation.lcm.independent.1
        primary_skill: math.prereq.lcm
        purpose: independent
        prompt_ru: "Самостоятельно: найди НОК(4, 10)."
        verifier: {type: exact_integer, expected: 20}
      - id: frac.remediation.lcm.independent.2
        primary_skill: math.prereq.lcm
        purpose: independent
        prompt_ru: "Ещё одна проверка: найди НОК(9, 6)."
        verifier: {type: exact_integer, expected: 18}
